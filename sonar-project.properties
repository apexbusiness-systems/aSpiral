sonar.projectKey=aSpiral
sonar.sources=src
sonar.exclusions=coverage/**,dist/**,**/*.test.ts,**/*.test.tsx,refactor_catalog.cjs,scripts/**
sonar.cpd.exclusions=coverage/**,dist/**,**/*.test.ts,**/*.test.tsx,refactor_catalog.cjs,scripts/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# R3F (React Three Fiber) intrinsic JSX property suppressions.
# SonarCloud does not understand R3F's extended JSX namespace (position, args,
# emissive, transparent, metalness, roughness, intensity, distance, etc.) and
# flags them as unknown HTML properties. All rules below are suppressed globally
# for 3D component files where R3F JSX intrinsics are used by design.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12

# Rule: Web:UnknownProperty - SonarCloud HTML/JSX unknown property checker
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:UnknownProperty
sonar.issue.ignore.multicriteria.e1.resourceKey=src/**/*.tsx

# Rule: javascript:S6730 - Unknown JSX property (JS analysis engine)
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S6730
sonar.issue.ignore.multicriteria.e2.resourceKey=src/**/*.tsx

# Rule: typescript:S6730 - Unknown JSX property (TS analysis engine)
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S6730
sonar.issue.ignore.multicriteria.e3.resourceKey=src/**/*.tsx

# Rule: typescript:S6747 - Unknown attribute for element type
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S6747
sonar.issue.ignore.multicriteria.e4.resourceKey=src/**/*.tsx

# Rule: typescript:S6749 - Unnecessary JSX attribute
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S6749
sonar.issue.ignore.multicriteria.e5.resourceKey=src/**/*.tsx

# Rule: javascript:S6749 - Unnecessary JSX attribute (JS engine)
sonar.issue.ignore.multicriteria.e6.ruleKey=javascript:S6749
sonar.issue.ignore.multicriteria.e6.resourceKey=src/**/*.tsx

# Rule: typescript:S6751 - JSX props spreading
sonar.issue.ignore.multicriteria.e7.ruleKey=typescript:S6751
sonar.issue.ignore.multicriteria.e7.resourceKey=src/**/*.tsx

# Rule: Web:S5148 - Anchor element target
sonar.issue.ignore.multicriteria.e8.ruleKey=Web:S5148
sonar.issue.ignore.multicriteria.e8.resourceKey=src/**/*.tsx

# Rule: javascript:S6481 - useEffect missing dependency (suppress in 3D perf-critical components)
sonar.issue.ignore.multicriteria.e9.ruleKey=javascript:S6481
sonar.issue.ignore.multicriteria.e9.resourceKey=src/components/3d/**/*.tsx

# Rule: typescript:S6481 - useEffect missing dependency (TS engine)
sonar.issue.ignore.multicriteria.e10.ruleKey=typescript:S6481
sonar.issue.ignore.multicriteria.e10.resourceKey=src/components/3d/**/*.tsx

# Rule: javascript:S6747 - Unknown JSX attribute (JS engine variant)
sonar.issue.ignore.multicriteria.e11.ruleKey=javascript:S6747
sonar.issue.ignore.multicriteria.e11.resourceKey=src/**/*.tsx

# Rule: react:no-unknown-property - ESLint React Unknown property imported by Sonar
sonar.issue.ignore.multicriteria.e12.ruleKey=react:no-unknown-property
sonar.issue.ignore.multicriteria.e12.resourceKey=src/**/*.tsx
